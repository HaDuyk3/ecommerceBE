spring.config.import=optional:classpath:application-local.properties

spring.application.name=ecommerce

spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=604800000

spring.data.redis.host=localhost
spring.data.redis.port=6379

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

spring.data.web.pageable.default-page-size=20

# Order timeout (T1.4)
app.order.pending-timeout-minutes=30
app.order.timeout-check-interval-ms=300000

# Promotion expiry job (T2.3)
app.promotion.expire-check-interval-ms=300000

# Payment gateway secrets (override in application-local.properties)
payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:sandbox-secret}
payment.vnpay.tmn-code=${VNPAY_TMN_CODE:SANDBOX}
payment.momo.secret-key=${MOMO_SECRET_KEY:sandbox-secret}
payment.momo.access-key=${MOMO_ACCESS_KEY:sandbox-access}

# Payment timeout job (T3.3)
app.payment.processing-timeout-minutes=30
app.payment.timeout-check-interval-ms=300000
app.payment.reconciliation-cron=0 0 2 * * *
