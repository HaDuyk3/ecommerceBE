# Reference only. Runtime config uses application.properties (dev defaults)
# plus optional application-local.properties (copy from application-local.properties.example).

spring.application.name=ecommerce

spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.port=8080

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=604800000

spring.data.redis.host=localhost
spring.data.redis.port=6379

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
